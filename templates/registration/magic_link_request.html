<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Link Login - {{ APP_NAME }}</title>
    {% if BRANDING and BRANDING.favicon %}
    <link rel="icon" href="{{ BRANDING.favicon.url }}">
    <link rel="shortcut icon" href="{{ BRANDING.favicon.url }}">
    {% else %}
    <link rel="icon" href="/static/favicon.ico">
    <link rel="shortcut icon" href="/static/favicon.ico">
    {% endif %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .btn-primary {
            background-color: {% if BRANDING %}{{ BRANDING.primary_color_dark }}{% else %}#0d6efd{% endif %} !important;
            border-color: {% if BRANDING %}{{ BRANDING.primary_color_dark }}{% else %}#0d6efd{% endif %} !important;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;
    background-color: {% if BRANDING %}{{ BRANDING.login_bg_color }}{% else %}#212529{% endif %};
    {% if BRANDING and BRANDING.login_bg_image %}
    background-image: url('{{ BRANDING.login_bg_image.url }}');
    background-size: cover;
    background-position: center;
    {% endif %}
">
    <div class="card" style="width: 400px;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                {% if BRANDING and BRANDING.logo %}
                <img src="{{ BRANDING.logo.url }}" alt="{{ APP_NAME }}" style="max-height:50px; max-width:300px;">
                {% else %}
                <h3><i class="bi bi-briefcase"></i> {{ APP_NAME }}</h3>
                {% endif %}
            </div>

            <h6 class="text-center text-muted mb-3">Email me a login link</h6>

            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_email" class="form-label">Email address</label>
                    <input type="email" name="email" id="id_email" class="form-control" autofocus required
                           placeholder="you@example.com">
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-envelope me-1"></i> Send Login Link
                </button>
            </form>

            <hr class="my-3">
            <div class="text-center">
                <a href="{% url 'login' %}" class="text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> Back to password login
                </a>
            </div>
        </div>
    </div>
</body>
</html>
